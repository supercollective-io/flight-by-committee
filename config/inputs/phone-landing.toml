# A reusable phone layout and aircraft mapping, selected by a flight profile.
layout = "landing"
port = 8080
expiry_s = 1.0
ready_property = "/sim/committee/approach-ready"
# Explicit release also clears the model's independent parking/automatic brakes.
brake_release_paths = ["/controls/gear/brake-left", "/controls/gear/brake-right", "/controls/gear/copilot-brake-left", "/controls/gear/copilot-brake-right", "/controls/gear/brake-parking", "/autopilot/autobrake/step"]

[controls.roll]
paths = ["/controls/flight/aileron"]
scale = 0.6

[controls.pitch]
paths = ["/controls/flight/elevator"]
# Positive FlightGear elevator lowers the nose; dragging down should raise it.
scale = -0.6

[controls.rudder]
paths = ["/controls/flight/rudder"]
scale = 1.0

[controls.brake]
paths = ["/controls/gear/brake-left", "/controls/gear/brake-right"]
scale = 1.0

[controls.throttle]
paths = ["/controls/engines/engine[0]/throttle", "/controls/engines/engine[1]/throttle", "/controls/engines/engine[2]/throttle", "/controls/engines/engine[3]/throttle"]
scale = 1.0
