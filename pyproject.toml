[project]
name = "flight-by-committee"
version = "0.1.0"
description = "FlightGear profiles and feasibility experiments"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11,<4",
    "resvg-py>=0.5.0",
]

[project.scripts]
fly = "scripts.flightgear:main"
flight-relay = "scripts.relay:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
module-root = ""
