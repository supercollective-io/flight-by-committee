<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Flight by committee · Flight controls</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101820;color:#eef4f5}*{box-sizing:border-box}body{margin:0 auto;padding:18px;max-width:640px}h1{font-size:22px;margin:0 0 12px}p{color:#aebdc5}#status{padding:12px;border:1px solid #71818c;border-radius:10px;margin-bottom:16px}#status.live{border-color:#6ae2ba;color:#6ae2ba}.controls{display:grid;gap:18px}#pad{height:clamp(180px,38vh,330px);background:linear-gradient(90deg,transparent 49.7%,#4b606c 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#4b606c 50%,transparent 50.3%),#1b2c37;border:1px solid #65808f;border-radius:18px;position:relative;touch-action:none;user-select:none}#pad span{position:absolute;pointer-events:none}#dot{width:24px;height:24px;background:#6ae2ba;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.top{top:12px;left:50%;transform:translateX(-50%)}.bottom{bottom:12px;left:50%;transform:translateX(-50%)}.left{left:12px;top:45%}.right{right:12px;top:45%}label{display:block}input[type=range]{width:100%;height:44px;accent-color:#6ae2ba;touch-action:none}.row{display:flex;gap:12px}button{flex:1;min-height:64px;border:1px solid #65808f;background:#1b2c37;border-radius:12px;color:inherit;font:inherit;touch-action:none;user-select:none}button.held{background:#306750}#brake{width:100%}small{color:#aebdc5}output{float:right}.disabled{opacity:.45;pointer-events:none}#feedback{font-variant-numeric:tabular-nums;font-size:14px;min-height:20px}#monitor{display:none}a{color:#6ae2ba}
.flight-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:16px;align-items:stretch}.throttle-control{display:flex;flex-direction:column;align-items:center;gap:8px}.throttle-control output{float:none}#throttle{writing-mode:vertical-lr;direction:rtl;width:48px;height:100%;min-height:150px;flex:1}#brake{width:auto}
</style>
<div id="status" role="status" aria-live="polite">Connecting…</div>
<div id="monitor"><div id="join"><img id="qr" alt="Scan to join the aircraft controls" width="280" height="280" hidden><p><a id="join-link"></a></p></div><h2>Computer connection monitor</h2><p>Pause, resume and reset in FlightGear. This page does not claim aircraft controls.</p></div>
<div class="controls disabled" id="controls">
<div class="flight-row"><div id="pad" role="application" aria-label="Pitch and roll touch pad"><span class="top">Nose down</span><span class="bottom">Nose up</span><span class="left">Left</span><span class="right">Right</span><span id="dot"></span></div>
<label class="throttle-control">Throttle <output id="power">—</output><input id="throttle" aria-label="All four engines throttle" type="range" min="0" max="1" step="0.01" value="0" aria-orientation="vertical"></label></div>
<div><label>Rudder / steering</label><div class="row"><button id="left">◀ Left</button><button id="right">Right ▶</button></div></div>
<div class="row"><button id="brake">Hold to brake</button><button id="release-brakes">Release brakes</button></div>
</div>
<p id="feedback"></p>
<script>
'use strict';
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), key=params.get('key');
const monitor=params.has('monitor');
if(monitor){
 $('controls').hidden=true;$('monitor').style.display='block';
 fetch('/join?key='+encodeURIComponent(key)).then(r=>r.json()).then(join=>{
  if(join.url){$('join-link').href=join.url;$('join-link').textContent=join.url;}
  if(join.qr){$('qr').src='/qr.svg?key='+encodeURIComponent(key);$('qr').hidden=false;}
 }).catch(()=>{$('join-link').textContent='Join details unavailable; check the terminal.';});
}
let session=sessionStorage.getItem('flight-session');
if(!session){session=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('flight-session',session);}
let challenge=null, enabled=false, lastReply=0, throttleVersion=0, releaseVersion=0, releasePending=false;
const values={roll:0,pitch:0,rudder:0,brake:0,throttle:null};
const pointers=new Map();
function draw(){ $('dot').style.left=(50+values.roll*45)+'%';$('dot').style.top=(50+values.pitch*45)+'%'; }
function release(){releasePending=false;values.roll=values.pitch=values.rudder=values.brake=0;values.throttle=null;pointers.clear();document.querySelectorAll('.held').forEach(x=>x.classList.remove('held'));draw();}
function availability(active){enabled=active;$('controls').classList.toggle('disabled',!active);$('throttle').disabled=!active;document.querySelectorAll('button').forEach(x=>x.disabled=!active);}
function lost(text){availability(false);challenge=null;release();$('status').textContent=text;$('status').className='';}
function padMove(e){if(!enabled||pointers.get('pad')!==e.pointerId)return;const r=$('pad').getBoundingClientRect();values.roll=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.45)));values.pitch=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.45)));draw();}
$('pad').addEventListener('pointerdown',e=>{if(!enabled||pointers.has('pad'))return;e.preventDefault();pointers.set('pad',e.pointerId);$('pad').setPointerCapture(e.pointerId);padMove(e);});
$('pad').addEventListener('pointermove',padMove);
for(const event of ['pointerup','pointercancel','lostpointercapture']) $('pad').addEventListener(event,e=>{if(pointers.get('pad')===e.pointerId){pointers.delete('pad');values.roll=values.pitch=0;draw();}});
for(const [id,axis,value] of [['left','rudder',-1],['right','rudder',1],['brake','brake',1]]){
 const b=$(id);b.addEventListener('pointerdown',e=>{if(!enabled||pointers.has(axis))return;e.preventDefault();pointers.set(axis,e.pointerId);values[axis]=value;b.setPointerCapture(e.pointerId);b.classList.add('held');});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{if(pointers.get(axis)===e.pointerId){pointers.delete(axis);values[axis]=0;b.classList.remove('held');}});
}
$('release-brakes').addEventListener('click',()=>{if(!enabled)return;pointers.delete('brake');values.brake=0;$('brake').classList.remove('held');releasePending=true;releaseVersion++;});
$('throttle').addEventListener('input',()=>{if(enabled){values.throttle=Number($('throttle').value);throttleVersion++;$('power').textContent=Math.round(values.throttle*100)+'%';}});
window.addEventListener('blur',()=>lost('Input released — reconnecting…'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)lost('Phone inactive — controls released');});
setInterval(()=>{if(performance.now()-lastReply>1000)lost('Disconnected — flight continues');},200);
async function exchange(){
 if(document.hidden){setTimeout(exchange,100);return;}
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),700);
 const sentVersion=throttleVersion, sentReleaseVersion=releaseVersion;
 try{
  const response=await fetch((monitor?'/status':'/input')+'?key='+encodeURIComponent(key),monitor?{signal:controller.signal}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,challenge,release_brakes:releasePending,controls:challenge?{...values}:null}),signal:controller.signal});
  if(!response.ok)throw Error('Connection refused');
  const s=await response.json();lastReply=performance.now();
  if(!s.simulator)lost('FlightGear unavailable');
  else if(!s.ready)lost('Waiting for approach readiness');
  else if(s.busy)lost('Another phone has control');
  else{
   if(s.resync)release();
   if(!monitor){challenge=s.challenge;availability(true);}
   $('status').textContent=s.active?'Connected · aircraft controls active':monitor?'Phone disconnected — flight continues':'Connected · ready';
   $('status').className=s.active?'live':'';
  }
  if(sentReleaseVersion===releaseVersion && !s.resync && !s.busy) releasePending=false;
  if(sentVersion===throttleVersion && !s.resync) values.throttle=null;
  if(values.throttle===null && (s.resync || document.activeElement!==$('throttle'))){$('throttle').value=s.throttle;$('power').textContent=Math.round(s.throttle*100)+'%';}
  $('feedback').textContent=s.active?`Accepted input · roll ${s.accepted.roll.toFixed(2)} · pitch ${s.accepted.pitch.toFixed(2)}`:'';
 }catch(e){lost('Disconnected — flight continues');}
 finally{clearTimeout(timeout);setTimeout(exchange,100);}
}
exchange();
</script>
</html>
