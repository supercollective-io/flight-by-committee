<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Flight by committee · Flight controls</title>
<style>
:root{color-scheme:light;font:16px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;background:#f3f3ef;color:#191919}*{box-sizing:border-box}body{margin:0 auto;padding:20px;max-width:640px}p{color:#555650}a{color:inherit;text-underline-offset:.2em}::selection{background:#e3fa49;color:#191919}:focus-visible{outline:3px solid #2455cc;outline-offset:3px}[hidden]{display:none!important}
#status{padding:12px 0;border-top:3px solid #191919;border-bottom:1px solid #bfc1b8;margin-bottom:16px;font-weight:700}#status.live{background:#e3fa49;padding:12px}#role-choice{display:flex;margin-bottom:16px}#role-choice button{flex:1;min-height:48px;background:#191919;color:white}#role-choice button:hover{background:#353630}.controls{display:grid;gap:16px}
#pad{height:100%;min-height:0;background:linear-gradient(90deg,transparent calc(50% - .5px),#bfc1b8 calc(50% - .5px),#bfc1b8 calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(transparent calc(50% - .5px),#bfc1b8 calc(50% - .5px),#bfc1b8 calc(50% + .5px),transparent calc(50% + .5px)),white;border:1px solid #85877e;position:relative;touch-action:none;user-select:none}#pad span{position:absolute;pointer-events:none}#dot{width:22px;height:22px;background:#191919;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.top{top:12px;left:50%;transform:translateX(-50%)}.bottom{bottom:12px;left:50%;transform:translateX(-50%)}.left{left:12px;top:45%}.right{right:12px;top:45%}label{display:block;font-weight:600}input[type=range]{width:100%;height:44px;accent-color:#191919;touch-action:none}.row{display:flex;gap:12px}button{flex:1;min-height:60px;padding:10px 12px;border:1px solid #191919;background:transparent;border-radius:0;color:inherit;font:inherit;font-weight:600;touch-action:manipulation;user-select:none;cursor:pointer}button:hover:not(:disabled){background:#e5e6dd}button.held{background:#e3fa49}button:disabled{cursor:not-allowed}#left,#right,#brake{touch-action:none}small{color:#555650}output{font-variant-numeric:tabular-nums}.disabled{pointer-events:none}.disabled #pad,.disabled button{background-color:#e5e6dd}.disabled label{color:#555650}#feedback{font-variant-numeric:tabular-nums;font-size:14px}#feedback:empty{display:none}#monitor{display:none}#monitor h1{font-size:1.75rem;letter-spacing:-.025em}#join-link{overflow-wrap:anywhere}#qr{max-width:100%;height:auto}
.flight-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;height:clamp(180px,38vh,360px);height:clamp(180px,38svh,360px);gap:16px;align-items:stretch}.throttle-control{position:relative;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;justify-items:center;min-height:0;gap:8px}#throttle{writing-mode:vertical-lr;direction:rtl;position:absolute;inset:0;width:48px;height:100%;min-height:0;margin:0}.throttle-track{position:relative;width:48px;min-height:0;align-self:stretch}
#group-dot{width:34px;height:34px;border:3px solid #354f12;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}#group-power-marker{position:absolute;right:0;width:12px;height:3px;background:#354f12;pointer-events:none}#group-power{color:#354f12;font-size:13px;white-space:nowrap}#release-brakes{flex:0 1 110px;font-size:14px}#brake{flex:1}#distribution{width:100%;height:auto;max-width:400px;background:white;border:1px solid #bfc1b8}footer{border-top:1px solid #bfc1b8;margin-top:20px;padding-top:16px;font-size:14px}@media(max-width:360px){body{padding:16px}.flight-row{gap:10px}}

</style>
<div id="status" role="status" aria-live="polite">Connecting…</div>
<p id="hybrid-help" hidden>Choose body or phone, one method at a time. Lower your arms when using your phone. Stop controlling here before using your body.</p>
<div id="role-choice"><button id="join-controls">Join flight controls</button><button id="observe" hidden>Stop controlling</button></div>
<div id="monitor"><div id="join"><img id="qr" alt="Scan to join the aircraft controls" width="280" height="280" hidden><p><a id="join-link"></a></p></div><h1>Flight monitor</h1><p>Pause, resume and reset in FlightGear. </p><svg id="distribution" viewBox="0 0 200 200" aria-label="Individual pitch and roll commands"><path d="M100 0V200M0 100H200" stroke="#bfc1b8"/><g id="votes"></g></svg></div>
<div class="controls disabled" id="controls">
<div class="flight-row"><div id="pad" role="application" tabindex="0" aria-label="Pitch and roll. Drag or hold arrow keys to steer."><span class="top">Nose down</span><span class="bottom">Nose up</span><span class="left">Left</span><span class="right">Right</span><span id="group-dot" hidden></span><span id="dot"></span></div>
<label class="throttle-control">Throttle <output id="power">—</output><span class="throttle-track"><input id="throttle" aria-label="All four engines throttle" type="range" min="0" max="1" step="0.01" value="0" aria-orientation="vertical"><span id="group-power-marker" hidden></span></span><span id="group-power">Group —</span></label></div>

<div><label>Rudder / steering</label><div class="row"><button id="left">Left</button><button id="right">Right</button></div></div>
<div class="row"><button id="brake">Hold to brake</button><button id="release-brakes">Release brakes</button></div>
</div>
<p id="feedback"></p><footer><a href="https://we.supercollective.io">Return to Rehearsing We</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), key=params.get('key');
const monitor=params.has('monitor');
if(monitor){
 $('role-choice').hidden=true;
 $('controls').hidden=true;$('monitor').style.display='block';
 fetch('/join?key='+encodeURIComponent(key)).then(r=>r.json()).then(join=>{
  if(join.url){$('join-link').href=join.url;$('join-link').textContent=join.url;}
  if(join.qr){$('qr').src='/qr.svg?key='+encodeURIComponent(key);$('qr').hidden=false;}
 }).catch(()=>{$('join-link').textContent='Join details unavailable; check the terminal.';});
}
let session=sessionStorage.getItem('flight-session');
if(!session){session=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('flight-session',session);}
let joined=false,roleVersion=0;
$('join-controls').addEventListener('click',()=>{roleVersion++;joined=true;challenge=null;release();$('join-controls').hidden=true;$('observe').hidden=false;});
$('observe').addEventListener('click',()=>{roleVersion++;joined=false;lost('Watching — your controls are released');$('join-controls').hidden=false;$('observe').hidden=true;if(!window.flightRequest)fetch('/leave?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session})}).catch(()=>{});});
let challenge=null, enabled=false, lastReply=0, throttleVersion=0, releaseVersion=0, releasePending=false;
const values={roll:0,pitch:0,rudder:0,brake:0,throttle:null};
const pointers=new Map(), padKeys=new Set();
function draw(){ $('dot').style.left=(50+values.roll*45)+'%';$('dot').style.top=(50+values.pitch*45)+'%'; }
function release(){releasePending=false;values.roll=values.pitch=values.rudder=values.brake=0;values.throttle=null;pointers.clear();padKeys.clear();document.querySelectorAll('.held').forEach(x=>x.classList.remove('held'));draw();}
function availability(active){enabled=active;$('controls').classList.toggle('disabled',!active);$('throttle').disabled=!active;document.querySelectorAll('button:not(#join-controls):not(#observe)').forEach(x=>x.disabled=!active);}
function lost(text){$('hybrid-help').hidden=true;$('group-dot').hidden=true;$('group-power-marker').hidden=true;availability(false);challenge=null;release();$('status').textContent=text;$('status').className='';}
function padMove(e){if(!enabled||pointers.get('pad')!==e.pointerId)return;const r=$('pad').getBoundingClientRect();values.roll=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.45)));values.pitch=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.45)));draw();}
$('pad').addEventListener('pointerdown',e=>{if(!enabled||pointers.has('pad'))return;e.preventDefault();pointers.set('pad',e.pointerId);$('pad').setPointerCapture(e.pointerId);padMove(e);});
$('pad').addEventListener('pointermove',padMove);
for(const event of ['pointerup','pointercancel','lostpointercapture']) $('pad').addEventListener(event,e=>{if(pointers.get('pad')===e.pointerId){pointers.delete('pad');values.roll=values.pitch=0;draw();}});
for(const [id,axis,value] of [['left','rudder',-1],['right','rudder',1],['brake','brake',1]]){
 const b=$(id);b.addEventListener('pointerdown',e=>{if(!enabled||pointers.has(axis))return;e.preventDefault();pointers.set(axis,e.pointerId);values[axis]=value;b.setPointerCapture(e.pointerId);b.classList.add('held');});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{if(pointers.get(axis)===e.pointerId){pointers.delete(axis);values[axis]=0;b.classList.remove('held');}});
}
const arrowKeys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
function drawKeyboardPad(){values.roll=Number(padKeys.has('ArrowRight'))-Number(padKeys.has('ArrowLeft'));values.pitch=Number(padKeys.has('ArrowDown'))-Number(padKeys.has('ArrowUp'));draw();}
$('pad').addEventListener('keydown',e=>{if(!arrowKeys.includes(e.key))return;e.preventDefault();if(!enabled||(pointers.has('pad')&&pointers.get('pad')!=='keyboard'))return;pointers.set('pad','keyboard');padKeys.add(e.key);drawKeyboardPad();});
$('pad').addEventListener('keyup',e=>{if(!arrowKeys.includes(e.key)||pointers.get('pad')!=='keyboard')return;e.preventDefault();padKeys.delete(e.key);drawKeyboardPad();if(!padKeys.size)pointers.delete('pad');});
$('pad').addEventListener('blur',()=>{if(pointers.get('pad')==='keyboard'){padKeys.clear();pointers.delete('pad');values.roll=values.pitch=0;draw();}});
for(const [id,axis,value] of [['left','rudder',-1],['right','rudder',1],['brake','brake',1]]){
 const b=$(id),owner='keyboard-'+id;
 const up=()=>{if(pointers.get(axis)===owner){pointers.delete(axis);values[axis]=0;b.classList.remove('held');}};
 b.addEventListener('keydown',e=>{if(![' ','Enter'].includes(e.key))return;e.preventDefault();if(!enabled||pointers.has(axis))return;pointers.set(axis,owner);values[axis]=value;b.classList.add('held');});
 b.addEventListener('keyup',e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();up();}});
 b.addEventListener('blur',up);
}
$('release-brakes').addEventListener('click',()=>{if(!enabled)return;pointers.delete('brake');values.brake=0;$('brake').classList.remove('held');releasePending=true;releaseVersion++;});
$('throttle').addEventListener('input',()=>{if(enabled){values.throttle=Number($('throttle').value);throttleVersion++;$('power').textContent=Math.round(values.throttle*100)+'%';}});
window.addEventListener('blur',()=>lost('Input released — reconnecting…'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)lost('Phone inactive — controls released');});
setInterval(()=>{if(performance.now()-lastReply>1000)lost('Disconnected — flight continues');},200);
async function exchange(){
 if(document.hidden){setTimeout(exchange,100);return;}
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),700);
 const observing=monitor||!joined,sentRole=roleVersion;
 const sentVersion=throttleVersion, sentReleaseVersion=releaseVersion;
 try{
  const response=await (window.flightRequest||fetch)((observing?'/status':'/input')+'?key='+encodeURIComponent(key),observing?{signal:controller.signal}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,challenge,release_brakes:releasePending,controls:challenge?{...values}:null}),signal:controller.signal});
  if(!response.ok)throw Error('Connection refused');
  const s=await response.json();if(sentRole!==roleVersion)return;lastReply=performance.now();
  $('hybrid-help').hidden=s.mode!=='hybrid'||monitor;
  if(s.relay===false)lost('Relay unavailable — flight continues');
  else if(!s.simulator)lost('FlightGear unavailable');
  else if(!s.ready)lost('Waiting for approach readiness');
  else{
   if(s.resync)release();
   if(!observing){challenge=s.challenge;availability(true);}else availability(false);
   $('status').textContent=s.active?`${observing?'Watching':'Controlling'} · ${s.sources?`${s.sources.camera} camera + ${s.sources.phone} phone contributions`:`${s.count} active`}`:observing?'Observing · nobody active — flight continues':'Connected · ready';
   if(s.feedback_pending)$('status').textContent+=' · updating combined controls';
   if(s.mode==='hybrid'&&s.camera_available===false)$('status').textContent+=' · camera unavailable';
   if(s.mode==='hybrid'&&s.phone_available===false)$('status').textContent+=' · phones disconnected';
   $('status').className=s.active?'live':'';
  }
  if(sentReleaseVersion===releaseVersion && !s.resync) releasePending=false;
  if(sentVersion===throttleVersion && !s.resync) values.throttle=null;
  if(!observing && values.throttle===null && (s.resync || document.activeElement!==$('throttle'))){$('throttle').value=s.personal_throttle;$('power').textContent=Math.round(s.personal_throttle*100)+'%';}
  const group=s.collective;
  $('group-dot').hidden=!s.active;
  $('group-dot').style.left=(50+group.roll*45)+'%';$('group-dot').style.top=(50+group.pitch*45)+'%';
  const power=group.throttle===null?s.throttle:group.throttle;
  $('group-power').textContent='Group '+Math.round(power*100)+'%';
  $('group-power-marker').hidden=!s.ready;$('group-power-marker').style.bottom=(power*100)+'%';
  if(monitor){
   $('votes').innerHTML=s.inputs.map(v=>`<circle cx="${100+v.roll*90}" cy="${100+v.pitch*90}" r="4" fill="#191919" opacity=".6"/>`).join('')+`<circle cx="${100+group.roll*90}" cy="${100+group.pitch*90}" r="8" fill="none" stroke="#354f12" stroke-width="2"/>`;
   $('feedback').textContent=`Group command · roll ${group.roll.toFixed(2)} · pitch ${group.pitch.toFixed(2)} · rudder ${group.rudder.toFixed(2)} · brake ${Math.round(group.brake*100)}% · throttle ${Math.round(power*100)}%`;
  }

 }catch(e){lost('Disconnected — flight continues');}
 finally{clearTimeout(timeout);setTimeout(exchange,100);}
}
exchange();
</script>
</html>
